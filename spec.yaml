schemaVersion: "1"
kind: mixin
name: sbx-statusline
description: Statusline and rules for claude sandboxes

commands:
  startup:
    # merge, don't overwrite: the sandbox's own settings.json keeps its keys
    - command:
        - sh
        - -c
        - |
          set -e
          f="$HOME/.claude/settings.json"
          [ -s "$f" ] || echo '{}' > "$f"
          # append to hooks.Notification rather than replacing it; drop any prior copy first so reruns are no-ops
          jq --arg cmd "~/.claude/claude-bell.sh" '. + {
            statusLine: {
              type: "command",
              command: "~/.claude/statusline.sh",
              refreshInterval: 30
            },
            preferredNotifChannel: "terminal_bell"
          }
          | .hooks.Notification = ((.hooks.Notification // [])
              | map(select(any(.hooks[]?; .command == $cmd) | not))
              + [{hooks: [{type: "command", command: $cmd}]}])' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"
