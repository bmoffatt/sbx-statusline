name: publish

# Push the kit to Docker Hub as :latest on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REPO: docker.io/${{ vars.DOCKERHUB_USERNAME }}/sbx-statusline

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # sbx falls back to Docker credentials when there is no `sbx login` session.
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same route as the sandbox-kit-spec README (Ubuntu apt repo).
      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      - name: Push kit
        run: sbx kit push . "$REPO:latest"
